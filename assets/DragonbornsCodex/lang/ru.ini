combat.bows_and_crossbows_draw_three=Лук и арбалет натягиваются втрое быстрее, любой выстрел — как при полном натяжении (полный урон и скорость), а стрела летит точно в прицел, без дуги, с сильным автонаведением. Только для Довакина.
combat.the_dragonborn_s_arrows_and=Стрелы, болты, боевые заклинания, посохи и крики Довакина сами летят в цель: людям в голову, зверям в центр тела; стрелы и снаряды-заклинания (огненная стрела, ледяной шип, огненный шар) догоняют бегущую цель. Наводятся только враждебные заклинания — лечение, успокоение, призыв нет. Сначала — враг или дикий зверь до 25° от прицела; мирные (стража, жители, скот, питомцы) — только при прицеливании почти точно в них. Спутники и призванные не в счёт.
combat.while_a_bow_or_crossbow=Пока натянут лук или арбалет, мир замедляется, как от способности «Зоркий глаз», только сильнее.
