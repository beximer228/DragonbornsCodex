combat.while_picking_a_lock_an=Во время взлома вокруг замка дуга: зелёное — замок откроется, жёлтое — повернётся частично, красное — не сдвинется; треугольник — отмычка. Снизу — куда и на сколько градусов вести и на сколько повернётся замок.
combat.while_lockpicking_there_are_always=Во время взлома отмычек всегда не меньше 10 — можно ломать сколько угодно.
