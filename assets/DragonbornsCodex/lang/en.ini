combat.bows_and_crossbows_draw_three=Bows and crossbows draw three times faster, every shot counts as fully drawn (full damage and speed), and arrows fly straight to the crosshair without an arc, with strong aim assist. Dragonborn only.
combat.the_dragonborn_s_arrows_and=The Dragonborn's arrows, bolts, combat spells, staves and shouts fly at the target by themselves: people in the head, beasts in the middle of the body; arrows and missile spells (firebolt, ice spike, fireball) catch up with a running target. Only hostile spells are aimed — heals, calm and summons are not. First an enemy or a wild animal within 25° of the crosshair; non-hostiles (guards, citizens, livestock, pets) only when aimed almost exactly. Followers and summons are ignored.
